[package]
name = "horizon-bug-report"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Report Bugs from the pause menu: a form that writes the GitHub issue itself and sends it through the telemetry server"

[dependencies]
horizon-platform = { path = "../horizon-platform" }
# The server's address (`endpoint`) only: nothing of the opt-in data collection.
horizon-telemetry = { path = "../horizon-telemetry", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
log = "0.4"

[lints]
workspace = true
